[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "boberdetective"
version = "0.1.0"
description = "Local, auditable investigative document intelligence workbench."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "marko>=2.2,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pillow>=10.0,<13.0",
  "pypdf>=5.0,<6.0",
  "pypdfium2>=4.30,<5.0",
  "python-multipart>=0.0.9,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]
docling = [
  "docling>=2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
